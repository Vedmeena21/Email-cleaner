[project]
name = "mail-cleaner"
version = "0.1.0"
description = "Declarative, move-only email cleanup run by Claude Code over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]
# only needed by tests/seed.py (Gmail test seeding through the Gmail API)
seed = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
