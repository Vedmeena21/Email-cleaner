<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 482" width="880" height="482" role="img" aria-label="Animated diagram: emails leave the inbox, pass your rules after a dry run and your yes, and land in labels and folders. Nothing is deleted.">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .chip{animation:go 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .fold{animation:land 10s ease-in-out infinite}
  .gate{animation:scan 10s linear infinite}
  @keyframes go{
    0%{transform:translateX(0) scale(1);opacity:0}
    5%,14%{transform:translateX(0) scale(1);opacity:1}
    58%{transform:translateX(578px) scale(1);opacity:1}
    66%,100%{transform:translateX(640px) scale(.35);opacity:0}
  }
  @keyframes land{
    0%,60%{fill:#FFFFFF;stroke-width:1.5}
    66%{fill:var(--c);stroke-width:3}
    80%,100%{fill:#FFFFFF;stroke-width:1.5}
  }
  @keyframes scan{0%,100%{opacity:.45}50%{opacity:1}}
</style>
<rect width="880" height="482" rx="18" fill="#F6F8FA"/>
<rect x="1" y="1" width="878" height="480" rx="17" fill="none" stroke="#D0D7DE"/>
<text class="t" x="440.0" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2328">Mail Cleaner</text>
<text class="t" x="440.0" y="70" text-anchor="middle" font-size="14" fill="#59636E">Sort and label your email with simple rules</text>
<rect x="24" y="94" width="190" height="326" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text class="t" x="119" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">Inbox</text>
<rect class="gate" x="352" y="94" width="150" height="326" rx="14" fill="#EAF2FF" stroke="#4C7BF4" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="t" x="427" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">Your rules</text>
<text class="t" x="427" y="406" text-anchor="middle" font-size="11.5" fill="#3B5FC4">dry run, then your yes</text>
<text class="t" x="778" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">Labels and folders</text>
<line x1="214" y1="166" x2="702" y2="166" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 5"/>
<rect class="fold" style="--c:#4C7BF433" x="702" y="144" width="152" height="44" rx="10" fill="#FFFFFF" stroke="#4C7BF4" stroke-width="1.5"/>
<text class="t" x="778" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Dump1</text>
<line x1="214" y1="222" x2="702" y2="222" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 5"/>
<rect class="fold" style="--c:#F59E0B33" x="702" y="200" width="152" height="44" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text class="t" x="778" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Dump2_Promos</text>
<line x1="214" y1="278" x2="702" y2="278" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 5"/>
<rect class="fold" style="--c:#8B5CF633" x="702" y="256" width="152" height="44" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
<text class="t" x="778" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Dump3_Automated</text>
<line x1="214" y1="334" x2="702" y2="334" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 5"/>
<rect class="fold" style="--c:#10B98133" x="702" y="312" width="152" height="44" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text class="t" x="778" y="339" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Dump4_OTP</text>
<line x1="214" y1="390" x2="702" y2="390" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 5"/>
<rect class="fold" style="--c:#64748B33" x="702" y="368" width="152" height="44" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text class="t" x="778" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Archive_Old</text>
<g class="chip" style="animation-delay:0.0s"><rect x="36" y="147" width="166" height="38" rx="9" fill="#FFFFFF" stroke="#4C7BF4" stroke-width="1.5"/><rect x="36" y="147" width="6" height="38" rx="3" fill="#4C7BF4"/><text class="t" x="52" y="163" font-size="11.5" font-weight="600" fill="#1F2328">Holiday photos (6 MB)</text><text class="t" x="52" y="178" font-size="10" fill="#59636E">big file</text></g>
<g class="chip" style="animation-delay:0.55s"><rect x="36" y="203" width="166" height="38" rx="9" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/><rect x="36" y="203" width="6" height="38" rx="3" fill="#F59E0B"/><text class="t" x="52" y="219" font-size="11.5" font-weight="600" fill="#1F2328">50% off everything</text><text class="t" x="52" y="234" font-size="10" fill="#59636E">promotion</text></g>
<g class="chip" style="animation-delay:1.1s"><rect x="36" y="259" width="166" height="38" rx="9" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/><rect x="36" y="259" width="6" height="38" rx="3" fill="#8B5CF6"/><text class="t" x="52" y="275" font-size="11.5" font-weight="600" fill="#1F2328">Your monthly statement</text><text class="t" x="52" y="290" font-size="10" fill="#59636E">automated</text></g>
<g class="chip" style="animation-delay:1.6500000000000001s"><rect x="36" y="315" width="166" height="38" rx="9" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/><rect x="36" y="315" width="6" height="38" rx="3" fill="#10B981"/><text class="t" x="52" y="331" font-size="11.5" font-weight="600" fill="#1F2328">Your verification code</text><text class="t" x="52" y="346" font-size="10" fill="#59636E">login code</text></g>
<g class="chip" style="animation-delay:2.2s"><rect x="36" y="371" width="166" height="38" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/><rect x="36" y="371" width="6" height="38" rx="3" fill="#64748B"/><text class="t" x="52" y="387" font-size="11.5" font-weight="600" fill="#1F2328">Lunch next week?</text><text class="t" x="52" y="402" font-size="10" fill="#59636E">read, no reply</text></g>
<text class="t" x="440.0" y="458" text-anchor="middle" font-size="13" fill="#1F2328"><tspan font-weight="700">Moves and labels only.</tspan> <tspan fill="#59636E">Nothing is deleted. Every run can be undone.</tspan></text></svg>